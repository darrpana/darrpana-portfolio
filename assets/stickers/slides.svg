<svg xmlns="http://www.w3.org/2000/svg" viewBox="-22 -12 324 244" width="324" height="244">
  <title>Sticker: a pair of slides, mid-stride</title>
  <defs>
    <filter id="sticker" x="-25%" y="-25%" width="150%" height="150%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="19" result="grown"/>
      <feFlood flood-color="#6C6AFB"/>
      <feComposite in2="grown" operator="in" result="backing"/>
      <!-- paper die-cut edge so the sticker also reads on dark backgrounds -->
      <feMorphology in="SourceAlpha" operator="dilate" radius="25" result="edge"/>
      <feFlood flood-color="#FBF8F2"/>
      <feComposite in2="edge" operator="in" result="paper"/>
      <feMerge><feMergeNode in="paper"/><feMergeNode in="backing"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="slide">
      <path d="M0 -60 C26 -60 30 -30 28 0 C26 40 20 60 0 60 C-20 60 -26 40 -28 0 C-30 -30 -26 -60 0 -60 Z" fill="#6C6AFB" stroke-width="8"/>
      <path d="M-34 -30 Q0 -44 34 -30 L33 8 Q0 -6 -33 8 Z" fill="#151515" stroke-width="8"/>
      <g stroke="#6C6AFB" stroke-width="4.5" fill="none">
        <path d="M-25 -24 Q0 -34 25 -24"/><path d="M-25 -12 Q0 -22 25 -12"/><path d="M-25 0 Q0 -10 25 0"/>
      </g>
    </g>
  </defs>
  <g filter="url(#sticker)" stroke="#151515" stroke-linecap="round" stroke-linejoin="round">
    <use href="#slide" transform="translate(92 128) rotate(-20)"/>
    <use href="#slide" transform="translate(190 86) rotate(-6)"/>
    <g stroke-width="10" fill="none">
      <path d="M14 150 L36 160"/><path d="M8 176 L34 180"/><path d="M20 202 L42 198"/>
    </g>
  </g>
</svg>
