<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="600" height="520">
  <title>Sticker: closing time — laptop shut, lamp off, slides kicked off under the table</title>
  <defs>
    <filter id="sticker" x="-10%" y="-10%" width="120%" height="120%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="15" result="grown"/>
      <feFlood flood-color="#6C6AFB"/>
      <feComposite in2="grown" operator="in" result="backing"/>
      <feMerge><feMergeNode in="backing"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#sticker)" stroke="#151515" stroke-linecap="round" stroke-linejoin="round">
    <!-- lamp (off) -->
    <path d="M250 28 L250 112" fill="none" stroke-width="7"/>
    <path d="M198 160 Q200 108 250 106 Q300 108 302 160 Z" fill="#6C6AFB" stroke-width="9"/>
    <path d="M232 160 Q250 186 268 160 Z" fill="#151515" stroke-width="8"/>
    <!-- table -->
    <path d="M110 418 L118 506" fill="none" stroke-width="16"/>
    <path d="M490 418 L482 506" fill="none" stroke-width="16"/>
    <path d="M56 404 L544 400 Q556 400 556 410 L556 414 Q556 422 546 422 L56 426 Q46 426 46 416 L46 412 Q46 404 56 404 Z" fill="#6C6AFB" stroke-width="9"/>
    <!-- closed laptop -->
    <path d="M176 362 L346 360 L384 392 L138 394 Z" fill="#6C6AFB" stroke-width="9"/>
    <path d="M138 394 L384 392 L384 403 L138 405 Z" fill="#151515" stroke-width="7"/>
    <ellipse cx="261" cy="377" rx="15" ry="7" fill="#151515" stroke-width="0"/>
    <path d="M252 374 Q261 381 270 378" fill="none" stroke="#6C6AFB" stroke-width="3"/>
    <!-- slides on the floor -->
    <g transform="translate(222 488) rotate(-4) scale(1.3)">
      <path d="M-46 4 L44 0 Q54 0 52 10 L-42 14 Q-50 14 -46 4 Z" fill="#6C6AFB" stroke-width="7"/>
      <path d="M-30 4 Q-10 -36 22 2 Z" fill="#151515" stroke-width="7"/>
      <path d="M-20 -4 Q-8 -22 10 -6" fill="none" stroke="#6C6AFB" stroke-width="4"/>
    </g>
    <g transform="translate(360 494) rotate(9) scale(1.3)">
      <path d="M-46 4 L44 0 Q54 0 52 10 L-42 14 Q-50 14 -46 4 Z" fill="#6C6AFB" stroke-width="7"/>
      <path d="M-30 4 Q-10 -36 22 2 Z" fill="#151515" stroke-width="7"/>
      <path d="M-20 -4 Q-8 -22 10 -6" fill="none" stroke="#6C6AFB" stroke-width="4"/>
    </g>
  </g>
</svg>
